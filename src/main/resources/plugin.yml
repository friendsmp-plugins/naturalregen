name: naturalregen
version: '${version}'
main: com.centers25.naturalregen.NaturalRegenPlugin
api-version: '26.2'
author: centers25
description: Resets a selected area back to the natural terrain the world seed would have generated.
depend: [plugincore]
softdepend: [WorldEdit]
commands:
  nregen:
    description: Reset an area to natural seed terrain.
    usage: /nregen help
    aliases: [naturalregen]
    permission: naturalregen.admin
permissions:
  naturalregen.admin:
    description: Use NaturalRegen.
    default: op
